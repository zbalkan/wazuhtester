name: Build and publish release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: mypy src/wazuhtester
      - run: pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Require main branch
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || { echo "Publishing must be triggered from main."; exit 1; }
      - name: Read package version
        id: version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Validate version tag state
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          CURRENT_SHA=$(git rev-parse HEAD)
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG_SHA=$(git rev-list -n 1 "$TAG")
            test "$TAG_SHA" = "$CURRENT_SHA" || { echo "$TAG already points to $TAG_SHA, not $CURRENT_SHA."; exit 1; }
          fi
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: python -c "import wazuhtester; print(wazuhtester.__version__)"
      - run: wazuhtester --help
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/

  integration:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zbalkan/wazuh-rule-tests
          ref: main
          path: rule-tests
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - name: Install exact release candidate wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest "dist/"*.whl
          python -c "import wazuhtester; print(wazuhtester.__version__)"
          wazuhtester --help
      - name: Install Wazuh manager
        env:
          WAZUH_VERSION: "4.14.8-1"
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gnupg apt-transport-https
          curl -fsSL https://packages.wazuh.com/key/GPG-KEY-WAZUH | gpg --dearmor | sudo tee /usr/share/keyrings/wazuh.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/wazuh.gpg] https://packages.wazuh.com/4.x/apt/ stable main" | sudo tee /etc/apt/sources.list.d/wazuh.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y "wazuh-manager=$WAZUH_VERSION"
          sudo usermod -aG wazuh "$(whoami)"
          sudo systemctl enable --now wazuh-manager
      - name: Wait for wazuh-logtest
        run: |
          for attempt in $(seq 1 120); do
            sudo test -S /var/ossec/queue/sockets/logtest && exit 0
            sleep 1
          done
          sudo systemctl status wazuh-manager --no-pager || true
          sudo journalctl -u wazuh-manager --no-pager -n 100 || true
          exit 1
      - name: Run external regression corpus
        run: |
          python_path=$(command -v python)
          sudo -u "$(whoami)" -g wazuh "$python_path" -m pytest rule-tests/tests -v --wazuh-require-logtest

  publish:
    needs: [build, integration]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  tag:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Create version tag after publication
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          TAG="v$VERSION"
          CURRENT_SHA=$(git rev-parse HEAD)
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG_SHA=$(git rev-list -n 1 "$TAG")
            test "$TAG_SHA" = "$CURRENT_SHA" || { echo "$TAG already points to $TAG_SHA, not $CURRENT_SHA."; exit 1; }
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
