[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wazuhtester"
version = "0.1.0.dev0"
description = "A Python library and CLI for the Wazuh logtest daemon."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Zafer Balkan" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Pytest",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]
dev = ["pytest>=8.0", "mypy>=1.10"]

[project.scripts]
wazuhtester = "wazuhtester.cli:main"

[project.urls]
Homepage = "https://github.com/zbalkan/wazuhtester"
Roadmap = "https://github.com/zbalkan/wazuhtester/blob/main/ROADMAP.md"
Issues = "https://github.com/zbalkan/wazuhtester/issues"

[project.entry-points.pytest11]
wazuhtester = "wazuhtester.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/wazuhtester"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/wazuhtester"]
